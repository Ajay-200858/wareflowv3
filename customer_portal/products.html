<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalogue — WareFlow Customer Commerce</title>
  <meta name="description" content="Browse WareFlow warehouse inventory with real-time stock availability, category filters, and bulk multi-SKU procurement.">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>

  <!-- Header -->
  <header id="site-header" class="site-header"></header>

  <!-- Page Breadcrumb & Header -->
  <div style="background:#ffffff; border-bottom:1px solid var(--color-border-subtle); padding:20px 0;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <div style="font-size:12px; color:var(--color-text-muted); margin-bottom:4px;">
          <a href="index.html">Home</a> / <span style="color:var(--color-text-primary);">Warehouse Catalogue</span>
        </div>
        <h1 style="font-size:26px;">Product Catalogue & Inventory</h1>
      </div>
      <div id="catalog-total-count" style="font-size:14px; color:var(--color-text-secondary); font-weight:600;">
        Loading catalogue...
      </div>
    </div>
  </div>

  <!-- Catalog Content Layout -->
  <main class="container catalog-layout">
    <!-- Sidebar Filters -->
    <aside class="filters-sidebar">
      <div class="filter-section">
        <div class="filter-title">Filter by Category</div>
        <div id="category-filters-list" class="filter-options">
          <div style="font-size:13px; color:#6b7280;">Loading categories...</div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title">Availability</div>
        <label class="filter-checkbox-label">
          <input type="checkbox" id="catalog-instock-toggle">
          <span>In-Stock Only (Ready to Ship)</span>
        </label>
      </div>

      <div class="filter-section">
        <div class="filter-title">Sort By</div>
        <select id="catalog-sort-select" class="form-select">
          <option value="popular">Popularity & Stock</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="name_asc">Name: A to Z</option>
          <option value="newest">Newest Additions</option>
        </select>
      </div>

      <div class="filter-section" style="border-bottom:none;">
        <div class="card" style="padding:14px; background:var(--color-bg-subtle);">
          <div style="font-weight:700; font-size:13px; margin-bottom:6px;">Need High Volume?</div>
          <p style="font-size:12px; color:var(--color-text-muted); margin-bottom:10px;">
            Order hundreds of items at once using our multi-line CSV order template.
          </p>
          <a href="bulk-order.html" class="btn btn-outline btn-sm btn-block">Open Bulk Tool</a>
        </div>
      </div>
    </aside>

    <!-- Products Main Area -->
    <section>
      <!-- Search Input Toolbar -->
      <div style="display:flex; gap:12px; margin-bottom:20px; align-items:center;">
        <div class="search-input-wrap" style="flex:1;">
          <div class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </div>
          <input type="text" id="catalog-search-input" class="search-input" placeholder="Search by name, SKU, or specification keyword...">
        </div>
      </div>

      <!-- Products Grid -->
      <div id="catalog-products-grid" class="products-grid">
        <!-- Rendered by products.js -->
      </div>

      <!-- Pagination -->
      <div id="catalog-pagination"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <script src="runtime-config.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/tracker.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/components/navbar.js"></script>
  <script src="assets/js/pages/products.js"></script>
</body>
</html>
