<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account Settings — WareFlow Commerce</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>

  <!-- Header -->
  <header id="site-header" class="site-header"></header>

  <div style="background:#ffffff; border-bottom:1px solid var(--color-border-subtle); padding:20px 0;">
    <div class="container">
      <div style="font-size:12px; color:var(--color-text-muted); margin-bottom:4px;">
        <a href="index.html">Home</a> / <span>Account Settings</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 id="account-header-name" style="font-size:26px;">Customer Account</h1>
          <div id="account-header-email" style="font-size:14px; color:var(--color-text-muted);">Loading...</div>
        </div>
        <div style="display:flex; gap:10px;">
          <a href="orders.html" class="btn btn-primary btn-sm">View Order History →</a>
          <button type="button" id="account-logout-btn" class="btn btn-secondary btn-sm" style="color:#c92a2a;">Sign Out</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container" style="padding-top:var(--space-2xl); padding-bottom:var(--space-3xl); max-width:800px;">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Commercial Contact & Shipping Destination Profile</span>
      </div>
      <div class="card-body">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label" for="profile-name">Contact Full Name</label>
            <input type="text" id="profile-name" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-company">Company / Business Name</label>
            <input type="text" id="profile-company" class="form-input">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label" for="profile-email">Registered Email (Read-Only)</label>
            <input type="email" id="profile-email" class="form-input" disabled style="background:var(--color-bg-subtle);">
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-phone">Receiving Dock Phone</label>
            <input type="tel" id="profile-phone" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-address">Default Delivery Dock Address</label>
          <textarea id="profile-address" class="form-textarea" rows="3" placeholder="Enter full dock and delivery details..."></textarea>
        </div>

        <button type="button" id="save-profile-btn" class="btn btn-primary">
          Save Changes
        </button>
      </div>
    </div>

    <!-- Quick Navigation Panel -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:24px;">
      <a href="orders.html" class="card" style="padding:16px; text-decoration:none; display:flex; align-items:center; gap:12px;">
        <div style="width:40px; height:40px; background:var(--color-brand-light); color:var(--color-brand-primary); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <div>
          <div style="font-weight:700; color:var(--color-text-primary);">Order History</div>
          <div style="font-size:12px; color:var(--color-text-muted);">View status and reorder items</div>
        </div>
      </a>

      <a href="bulk-order.html" class="card" style="padding:16px; text-decoration:none; display:flex; align-items:center; gap:12px;">
        <div style="width:40px; height:40px; background:var(--color-bg-subtle); color:var(--color-text-primary); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </div>
        <div>
          <div style="font-weight:700; color:var(--color-text-primary);">Bulk Procurement</div>
          <div style="font-size:12px; color:var(--color-text-muted);">Upload SKU inventory spreadsheet</div>
        </div>
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <script src="runtime-config.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/tracker.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/components/navbar.js"></script>
  <script src="assets/js/pages/account.js"></script>
</body>
</html>
